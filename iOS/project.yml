name: RJPCleaner
options:
  bundleIdPrefix: pt.rjp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.3.3
targets:
  RJPCleaner:
    type: application
    platform: iOS
    sources:
      - path: RJPCleaner/Sources
    resources:
      - path: RJPCleaner/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.rjp.cleaner.ios
        PRODUCT_NAME: RJP Cleaner
        INFOPLIST_KEY_CFBundleDisplayName: RJP Cleaner
        INFOPLIST_KEY_NSCameraUsageDescription: ""
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "O RJP Cleaner precisa de acesso às fotografias e vídeos para analisar ficheiros grandes e duplicados escolhidos pelo utilizador."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "O RJP Cleaner utiliza a Fototeca apenas para gerir conteúdos selecionados pelo utilizador."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
